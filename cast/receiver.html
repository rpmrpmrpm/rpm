    <script>
        /** Runs a piece of setup. If it fails, the failure is stored and not thrown, because nothing
            here is worth ending the Cast session for. See on(). */
        const setupFailures = [];
        function safely(what, work) {
            try { work(); } catch (e) { setupFailures.push(`${what}: ${(e && e.message) || e}`); }
        }

        /**
         * Registers a player listener. If this is not possible, the receiver continues.
         *
         * An event name that the SDK does not have is `undefined` here, and addEventListener throws
         * on it. That would stop the whole script at that line. Nothing after it would run,
         * including context.start(), so the receiver would show only static HTML: a logo, a CSS
         * animation and no Cast session. A missing listener is not a reason to accept this.
         */
        function on(type, handler) {
            try {
                if (!type) return false;
                playerManager.addEventListener(type, handler);
                return true;
            } catch (e) {
                return false;
            }
        }

        const NAMESPACE = 'urn:x-cast:com.rpmrpmrpm.control';
        const PROTOCOL = 1;

        const context = cast.framework.CastReceiverContext.getInstance();
        const playerManager = context.getPlayerManager();

        const el = {
            body: document.body,
            root: document.documentElement,
            room: document.getElementById('room'),
            fams: [document.getElementById('fam1'),
                   document.getElementById('fam2'),
                   document.getElementById('fam3')],
            sleeve: document.getElementById('sleeve'),
            covers: [document.getElementById('coverA'), document.getElementById('coverB')],
            noart: document.getElementById('noart'),
            label: document.getElementById('label'),
            vinyl: document.getElementById('vinyl'),
            words: document.getElementById('words'),
            title: document.getElementById('title'),
            artist: document.getElementById('artist'),
            album: document.getElementById('album'),
            lines: [document.getElementById('title-line'),
                    document.getElementById('artist-line'),
                    document.getElementById('album-line')],
            seek: document.getElementById('seek'),
            remain: document.getElementById('remain'),
            elapsed: document.getElementById('elapsed-line'),
            knob: document.getElementById('knob'),
            transport: document.getElementById('transport'),
            volumeFill: document.getElementById('volume-fill'),
            volumeKnob: document.getElementById('volume-knob'),
            trouble: document.getElementById('trouble'),
        };

        let coverTop = 0;     // which of the two cover layers is showing now

        /**
         * The track that the screen is showing, and the track that waits for its turn.
         *
         * A chained track is announced about ten seconds before it is heard. The app tells us when
         * its decoder swaps, while the speaker is still playing what is already in the buffer. So a
         * change carries the point in the stream where it happens, and it waits here until our own
         * clock reaches that point. Otherwise the television would show the name of the next song
         * over the end of this one.
         */
        let showing = null;
        let pending = null;

        /** Sends a message to the app. It is a broadcast: RPM is the only sender, and it can hold more
            than one connection to this receiver after a reconnect. */
        function tell(message) {
            context.sendCustomMessage(NAMESPACE, undefined, message);
        }

        // ══ the colours of a sleeve ═══════════════════════════════════════════════════════════════
        //
        // This code is ported from the app, function for function, so that the record on the
        // television has the same colour as the record on the screen that it is cast from.
        // CoverColor.Dominant / Highlight / Palette read the cover. VinylHue.Choose decides whether
        // the cover has a colour at all. RoomPalette works out the four colours of the room from
        // the result. The important comments are in the C# code. This code is a transcription and
        // must stay one.

        /** The square of 48 by 48 pixels that every reading is taken from. */
        function smallPixels(image) {
            const size = 48;
            const canvas = document.createElement('canvas');
            canvas.width = canvas.height = size;
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            ctx.drawImage(image, 0, 0, size, size);
            return ctx.getImageData(0, 0, size, size).data;
        }

        /** The coarse buckets that both readings share: 32 levels on each axis. `keep` removes the
            pixels that this reading treats as background. */
        function buckets(pixels, keep) {
            const found = new Map();
            for (let i = 0; i + 3 < pixels.length; i += 4) {
                const r = pixels[i], g = pixels[i + 1], b = pixels[i + 2];
                if (!keep(r, g, b)) continue;
                const key = ((r >> 5) << 10) | ((g >> 5) << 5) | (b >> 5);
                const have = found.get(key) || { count: 0, r: 0, g: 0, b: 0 };
                have.count++; have.r += r; have.g += g; have.b += b;
                found.set(key, have);
            }
            return [...found.values()];
        }

        const mean = v => [v.r / v.count, v.g / v.count, v.b / v.count];

        /** Vivid, present and bright, so that a small amount of real colour scores higher than a large
            area of dull colour. */
        function score(v) {
            const [r, g, b] = mean(v);
            const max = Math.max(r, g, b), min = Math.min(r, g, b);
            const sat = max <= 0 ? 0 : (max - min) / max;
            return sat * Math.sqrt(v.count) * (max / 255);
        }

        /** The dominant colour: the biggest bucket. Near-white paper and near-black are removed, so
            that a photo gets its colour from the subject and not from the wall behind it. */
        function dominantOf(pixels) {
            const found = buckets(pixels, (r, g, b) =>
                Math.max(r, g, b) >= 24 && Math.min(r, g, b) <= 232);
            if (!found.length) return null;
            found.sort((a, b) => b.count - a.count);
            return mean(found[0]);
        }

        /** The colours that a cover is made of, most telling first. No two of them are the same
            colour. Distance is measured between DIRECTIONS, so a light red and a dark red count as
            one colour. */
        function paletteOf(pixels, count) {
            const found = buckets(pixels, (r, g, b) =>
                Math.max(r, g, b) >= 40 && Math.max(r, g, b) - Math.min(r, g, b) >= 24);
            if (!found.length) return [];

            const scored = found.map(v => ({ score: score(v), colour: mean(v) }));
            scored.sort((a, b) => b.score - a.score);

            const chosen = [];
            for (const { colour } of scored) {
                if (chosen.length >= count) break;
                if (!chosen.some(taken => sameColour(taken, colour))) chosen.push(colour);
            }
            return chosen;
        }

        function unit(c) {
            const len = Math.sqrt(c[0] * c[0] + c[1] * c[1] + c[2] * c[2]);
            return len < 1e-4 ? [0, 0, 0] : [c[0] / len, c[1] / len, c[2] / len];
        }
        function sameColour(a, b) {
            const x = unit(a), y = unit(b);
            return Math.hypot(x[0] - y[0], x[1] - y[1], x[2] - y[2]) < 0.22;
        }

        /** VinylHue: below these limits a colour is a grey with rounding errors, or noise that looks
            like a hue. */
        const MIN_SATURATION = 0.18, MIN_BRIGHTNESS = 0.16;
        function usableHue(c) {
            if (!c) return false;
            const max = Math.max(c[0], c[1], c[2]), min = Math.min(c[0], c[1], c[2]);
            const sat = max <= 0 ? 0 : (max - min) / max;
            return sat >= MIN_SATURATION && max / 255 >= MIN_BRIGHTNESS;
        }

        /** Everything a sleeve says about its own colour, in one pass over the one square: the hue
            its record is pressed in, its dominant tone, its vivid accent and its third colour. */
        function readSleeve(image) {
            const pixels = smallPixels(image);
            const vivid = paletteOf(pixels, 2);
            const tint = dominantOf(pixels);
            const glow = vivid.length > 0 ? vivid[0] : null;
            const shade = vivid.length > 1 ? vivid[1] : null;
            // The vivid highlight is preferred to the dominant tone. The dominant colour of a sleeve
            // is often its background, and a record in the colour of the paper is not what people
            // mean by "the colour of that album".
            const hue = usableHue(glow) ? glow : (usableHue(tint) ? tint : null);
            return { hue, tint, glow, shade };
        }

        // ── RoomPalette: the four colours of the room ───────────────────────────────────────────

        const ROOM_FALLBACK = {
            ground: [0.012, 0.030, 0.070],
            tint: [0.012, 0.443, 0.816],
            glow: [0.02, 0.78, 1.0],
            shade: [0.62, 0.16, 0.72],
        };

        const clamp01 = v => Math.min(1, Math.max(0, v));

        /** A colour moved away from its grey and set to a working brightness. The hue stays the same. */
        function vividise(c, saturate, lift) {
            const luma = c[0] * 0.2126 + c[1] * 0.7152 + c[2] * 0.0722;
            let v = c.map(x => clamp01(luma + (x - luma) * saturate));
            const peak = Math.max(v[0], v[1], v[2]);
            if (peak > 1e-4) v = v.map(x => x * lift / peak);
            return v.map(clamp01);
        }

        /** The standard hue rotation that keeps luma. It gives a counter-colour that still belongs to
            the sleeve it came from, and is not taken from nowhere. */
        function turnHue(c, degrees) {
            const a = degrees * Math.PI / 180, k = Math.cos(a), s = Math.sin(a);
            const m = [
                [0.213 + k * 0.787 - s * 0.213, 0.715 - k * 0.715 - s * 0.715, 0.072 - k * 0.072 + s * 0.928],
                [0.213 - k * 0.213 + s * 0.143, 0.715 + k * 0.285 + s * 0.140, 0.072 - k * 0.072 - s * 0.283],
                [0.213 - k * 0.213 - s * 0.787, 0.715 - k * 0.715 + s * 0.715, 0.072 + k * 0.928 + s * 0.072],
            ];
            return m.map(row => clamp01(c[0] * row[0] + c[1] * row[1] + c[2] * row[2]));
        }

        function roomPalette(tint255, glow255, shade255) {
            const to01 = c => c ? c.map(x => x / 255) : null;
            const tint = to01(tint255), glow = to01(glow255), shade = to01(shade255);

            // The accent is the better colour to have. The dominant colour replaces it, and each
            // replaces the other when only one of them was found.
            const base = tint || glow;
            const accent = glow || base;
            if (!base || !accent) return ROOM_FALLBACK;

            let outTint = vividise(base, 1.35, 0.62);
            let outGlow = vividise(accent, 1.5, 0.90);

            let spare = shade && !sameColour(shade, base) && !sameColour(shade, accent) ? shade : null;

            // Many sleeves have one colour. Their dominant tone and their accent have the same hue,
            // and two families painted in them would look like one. The sleeve's own third colour is
            // used first. A rotation is used only if there is no third colour, because a rotation
            // makes a colour that is not anywhere on the record.
            if (sameColour(outTint, outGlow)) {
                if (spare) { outGlow = vividise(spare, 1.5, 0.90); spare = null; }
                else { outGlow = vividise(turnHue(accent, 42), 1.5, 0.90); }
            }

            const outShade = spare
                ? vividise(spare, 1.35, 0.76)
                : vividise(turnHue(base, 152), 1.4, 0.74);

            // The dark under the figures is the same hue, taken almost to black. The empty parts of
            // the screen then still belong to the record, and never compete with it.
            const lowered = vividise(base, 1.1, 0.16);
            const ground = lowered.map((x, i) => x * 0.55 + ROOM_FALLBACK.ground[i] * 0.45);

            return { ground, tint: outTint, glow: outGlow, shade: outShade };
        }

        const css = c => `rgb(${Math.round(c[0] * 255)}, ${Math.round(c[1] * 255)}, ${Math.round(c[2] * 255)})`;
        const cssA = (c, a) => `rgba(${Math.round(c[0] * 255)}, ${Math.round(c[1] * 255)}, ${Math.round(c[2] * 255)}, ${a})`;
        const mix = (a, b, t) => a.map((x, i) => x + (b[i] - x) * t);

        // ── the room, painted ──────────────────────────────────────────────────────────────────
        //
        // This is the shader's own constellation at one instant. The lobe centres of each family come
        // from the same expressions that rpmRoom uses: c = (cos(...)*k, sin(...)*k). The golden angle
        // spreads the phases of the first family, so that no two lobes return to the same place at
        // the same time. The radii are the shader's radii. All values are in the shader's units: p
        // is the plane with its origin in the middle, scaled by the window's HEIGHT. This is why the
        // results are in vh.
        //
        // The values are frozen at t = 0 and do not run. In the shader, TIME makes sure that the
        // picture is never twice in the same place. The drifts in the CSS above do this at a much
        // lower cost.
        const T = 0;

        function constellation(family) {
            const lobes = [];
            if (family === 1) {
                for (let i = 0; i < 6; i++) {
                    const a = T * (0.047 + i * 0.0115) + i * 2.39996;
                    lobes.push({
                        x: Math.cos(a + i * 1.3) * (0.46 + 0.20 * Math.sin(T * 0.031 + i)),
                        y: Math.sin(a * 0.83 + i * 2.1) * 0.32,
                        r: 0.20 + 0.055 * Math.sin(T * 0.21 + i * 1.7),
                        // wash += mix(tint, glow, fract(i * 0.41 + 0.15))
                        t: (i * 0.41 + 0.15) % 1,
                    });
                }
            } else if (family === 2) {
                for (let i = 0; i < 5; i++) {
                    const a = T * (0.083 + i * 0.021) + i * 1.7;
                    lobes.push({
                        x: Math.cos(a * 1.21 + i * 2.7) * 0.62,
                        y: Math.sin(a + i * 0.9) * 0.38,
                        r: 0.145 + 0.045 * Math.sin(T * 0.37 + i * 2.3),
                        // wash2 += mix(shade, glow, fract(i * 0.53 + 0.40))
                        t: (i * 0.53 + 0.40) % 1,
                    });
                }
            } else {
                for (let i = 0; i < 4; i++) {
                    const a = T * 1.3 * (0.095 + i * 0.026) + i * 2.9;
                    lobes.push({
                        x: Math.cos(a * 0.94 + i * 1.9) * 0.70,
                        y: Math.sin(a * 1.37 + i * 2.6) * 0.42,
                        r: 0.085 + 0.030 * Math.sin(T * 1.3 * 0.41 + i * 3.1),
                        t: 0,   // one colour only, so the family reads as a third layer
                    });
                }
            }
            return lobes;
        }

        /**
         * A family of lobes as one background, in the colours of this record.
         *
         * A lobe has no edge: r2 / (d2 + r2 * soft) never reaches zero. This lets six lobes blend
         * into one another and not overlap like coins. A radial gradient must stop somewhere, so
         * the gradient stops well outside the lobe. By then it has added almost nothing for the last
         * third of its length.
         *
         * @param reach how far past its own radius a lobe is drawn. This is roughly the shader's
         *              skirt, and it is wider for the families whose falloff is wider.
         */
        function familyPaint(lobes, from, to, reach, peak, ground) {
            return lobes.map(lobe => {
                // The colour is moved back toward the dark that the figures sit on.
                //
                // <b>This is the difference between the room and a bright sign.</b> RoomPalette
                // lifts the colours of a sleeve strongly: saturate 1.35 and 1.5, brightness 0.62 and
                // 0.90. The shader never paints these colours at full strength. It MIXES them into
                // the ground along a long ramp (smoothstep(0.30, 1.75, field)), and it reaches the
                // full colour only where several lobes overlap, which is a small part of any frame.
                // A gradient painted at the lifted colour would show that peak everywhere, and the
                // room would look fluorescent. The counter-colour is the worst case. For a gold
                // sleeve it is a turn of 152 degrees into teal, and it would look like a green lamp
                // and not like something seen faintly behind the music.
                const colour = mix(ground, mix(from, to, lobe.t), 0.78);
                const x = `calc(50% + ${(lobe.x * 100).toFixed(2)}vh)`;
                const y = `calc(50% - ${(lobe.y * 100).toFixed(2)}vh)`;
                const r = lobe.r * reach * 100;
                return `radial-gradient(circle ${r.toFixed(2)}vh at ${x} ${y}, ` +
                       `${cssA(colour, peak)} 0%, ` +
                       `${cssA(colour, peak * 0.55)} 32%, ` +
                       `${cssA(colour, peak * 0.18)} 62%, ` +
                       `${cssA(colour, 0)} 100%)`;
            }).join(', ');
        }

        /** Which bank of each family is showing. A change of record then crosses between banks and
            does not cut. */
        let bankTop = 0;

        function paintRoom(palette) {
            el.room.style.backgroundColor = css(palette.ground);

            // The first family fills the room, the second crosses it, and the third is a light
            // behind both. The strengths are the shader's ramps, each reduced to one number. A static
            // layer can carry only one number. The ramps exist to stop several overlapping lobes from
            // averaging into one colour, and here the lobes cannot overlap into anything other than
            // what was painted.
            // The strength of the third family matters most. It is drawn BEHIND the other two, and
            // its glow follows the top end of the music (0.16 + air * 0.62). This page has no
            // analysis, so `air` is zero, and the correct strength is 0.16. A higher strength would
            // light the room in the one colour that the sleeve does not have.
            const paints = [
                familyPaint(constellation(1), palette.tint, palette.glow, 2.6, 0.70, palette.ground),
                familyPaint(constellation(2), palette.shade, palette.glow, 3.0, 0.38, palette.ground),
                familyPaint(constellation(3), palette.shade, palette.shade, 4.0, 0.16, palette.ground),
            ];

            const next = bankTop ^ 1;
            el.fams.forEach((fam, i) => {
                const banks = fam.children;
                banks[next].style.backgroundImage = paints[i];
                banks[next].classList.add('on');
                banks[bankTop].classList.remove('on');
            });
            bankTop = next;
        }

        // ── the pressing ───────────────────────────────────────────────────────────────────────
        //
        // This is VinylPressing, on a canvas. There is one render, and it is tinted. The hue is
        // normalised to UNIT LUMINANCE, so multiplying by it changes the colour of a pixel and not
        // its brightness. The sweep of light across the disc, the grain of the grooves and the
        // curve of the rim all remain, because they are brightness, and nothing here changes
        // brightness.

        const LUMA = [0.2126, 0.7152, 0.0722];
        const PRESS_SATURATION = 0.88;   // how far a hue is applied, against leaving the vinyl black
        const PRESS_CEILING = 3.2;       // the highest value that any one channel may reach

        const neutral = new Image();
        let neutralReady = false;
        let pressed = null;              // the hue now on the canvas, so a repeat costs nothing

        neutral.onload = () => { neutralReady = true; press(pressed, true); };
        neutral.onerror = () => tell({ type: 'error', reason: 'vinyl-asset' });
        neutral.src = 'vinyl-record.png';

        function press(hue255, force) {
            if (!neutralReady) { pressed = hue255; return; }
            const key = hue255 ? hue255.map(Math.round).join(',') : 'black';
            if (!force && press.showing === key) return;
            press.showing = key;
            pressed = hue255;

            const size = neutral.naturalWidth || 768;
            const canvas = el.vinyl;
            canvas.width = canvas.height = size;
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            ctx.clearRect(0, 0, size, size);
            ctx.drawImage(neutral, 0, 0);

            const image = ctx.getImageData(0, 0, size, size);
            const px = image.data;

            let scale;
            if (hue255) {
                const r = hue255[0] / 255, g = hue255[1] / 255, b = hue255[2] / 255;
                const brightness = r * LUMA[0] + g * LUMA[1] + b * LUMA[2];
                if (brightness < 1e-6) { scale = null; }
                else {
                    scale = [r / brightness, g / brightness, b / brightness];
                    // Pulled back TOWARDS neutral until nothing is over the ceiling. It is pulled
                    // towards neutral and not scaled down, because scaling down would remove again the
                    // brightness that unit luminance has just set.
                    const peak = Math.max(scale[0], scale[1], scale[2]);
                    if (peak > PRESS_CEILING)
                        scale = scale.map(v => 1 + (v - 1) * ((PRESS_CEILING - 1) / (peak - 1)));
                    scale = scale.map(v => 1 + (v - 1) * PRESS_SATURATION);
                }
            }

            if (scale) {
                for (let i = 0; i < px.length; i += 4) {
                    px[i] = Math.min(255, px[i] * scale[0]);
                    px[i + 1] = Math.min(255, px[i + 1] * scale[1]);
                    px[i + 2] = Math.min(255, px[i + 2] * scale[2]);
                }
            } else {
                // Black vinyl, and DESATURATED. The render is not neutral: its body is a blue-black.
                // A tint multiplies this colour cast away, but a black pressing has no tint, so the
                // cast would show. The pixels are therefore reduced to their luma.
                for (let i = 0; i < px.length; i += 4) {
                    const y = px[i] * LUMA[0] + px[i + 1] * LUMA[1] + px[i + 2] * LUMA[2];
                    px[i] = px[i + 1] = px[i + 2] = y;
                }
            }

            ctx.putImageData(image, 0, 0);
        }

        // ── the cover ──────────────────────────────────────────────────────────────────────────

        /** The cover that is on the sleeve now, so that a second call with the same cover does nothing. */
        let shownArt = null;

        /**
         * Shows a cover: on the sleeve as a picture, on the label of the record as the app does it,
         * and in the room as light.
         *
         * The two cover layers cross-fade and do not cut. Nothing is changed until the picture can
         * be drawn. If the incoming layer got a new image and was shown in the same moment that the
         * outgoing layer was hidden, and the image was not ready to paint in that frame, then
         * neither layer would show anything. The flat colour under the whole page would then be
         * visible for a moment, on every track.
         */
        function swapTo(src, image) {
            shownArt = src;
            el.noart.classList.add('hidden');

            const going = el.covers[coverTop];
            const next = el.covers[coverTop ^ 1];
            next.style.backgroundImage = `url("${src}")`;
            next.classList.add('on');
            going.classList.remove('on');
            coverTop ^= 1;

            el.label.style.backgroundImage = `url("${src}")`;
            el.label.classList.add('art');

            // Now the room, the record and the frame of the sleeve. Reading the pixels can fail: a
            // cover fetched from the app's HTTP server taints the canvas unless the server answers
            // with CORS, which CastServer does. A room in the app's blue is a better result than no
            // room.
            let sleeve = null;
            try { sleeve = readSleeve(image); } catch (e) { sleeve = null; }

            if (sleeve) {
                paintRoom(roomPalette(sleeve.tint, sleeve.glow, sleeve.shade));
                press(sleeve.hue);
                // The frame is the dominant colour of the sleeve. If the sleeve has no colour, the
                // frame is a plain dark edge.
                el.root.style.setProperty('--frame',
                    sleeve.tint ? `rgb(${sleeve.tint.map(Math.round).join(',')})` : '#12161E');
            } else {
                paintRoom(ROOM_FALLBACK);
                press(null);
                el.root.style.setProperty('--frame', '#12161E');
            }
        }

        /**
         * @param src   a URL on the app's machine, or the picture itself as a data URI.
         * @param onFail called when the picture cannot be loaded at all. See the mixed-content note below.
         */
        function showArt(src, onFail) {
            // No cover for this record. The sleeve goes back to the quiet square, the record is
            // pressed black, and the room has the app's blue.
            if (!src) {
                if (shownArt === null) return;      // already showing nothing
                shownArt = null;
                el.noart.classList.remove('hidden');
                el.covers.forEach(c => c.classList.remove('on'));
                el.label.classList.remove('art');
                el.label.style.backgroundImage = '';
                paintRoom(ROOM_FALLBACK);
                press(null);
                el.root.style.setProperty('--frame', '#12161E');
                return;
            }

            // The same picture again. The app names the URL of a cover after its contents, so this
            // test is exact and not a guess: all the tracks of an album arrive with one URL. Doing
            // nothing is the purpose here. Otherwise a picture would dissolve into itself once for
            // each track, which is a flicker that shows nothing new.
            if (src === shownArt) return;

            // The app serves its artwork from the machine it runs on, over plain HTTP on the local
            // network, but this page is HTTPS. A browser may refuse this as mixed content. Trying the
            // URL costs nothing when it works, and it gives the full-resolution image. When it does
            // not work, the app is asked for the bytes instead.
            const probe = new Image();
            // The request is anonymous so that the pixels can be READ. A picture drawn from another
            // origin taints the canvas, and the palette of the whole room is read from a 48 by 48
            // copy of the picture. CastServer answers every request with
            // Access-Control-Allow-Origin, and a data: URI needs no permission at all.
            if (!src.startsWith('data:')) probe.crossOrigin = 'anonymous';
            probe.onerror = () => { if (onFail) onFail(); };
            probe.onload = () => {
                // decode() answers the exact question, "is this ready to paint", which is the
                // purpose here. If decode() is missing or refuses, onload is close enough.
                const go = () => swapTo(src, probe);
                if (probe.decode) probe.decode().then(go, go);
                else go();
            };
            probe.src = src;
        }

        // ── the words, and a line too long for its column ──────────────────────────────────────

        /**
         * Marquee.cs, as a keyframe.
         *
         * Ten seconds still, then a walk at reading pace, two seconds to read the end, and a quicker
         * run back. The walk is in POINTS A SECOND, so a long title takes longer than a short one.
         * If every line took the same time, the long ones would be unreadable.
         *
         * The keyframe is built for each line and is not declared once, because the distance is
         * different for each line. A line that fits is left alone, because an animation on it would
         * move it by zero and cost a frame a second.
         */
        const SCROLL_START_PAUSE = 10, SCROLL_END_PAUSE = 2;
        const SCROLL_SPEED = 42, RETURN_SPEED = 130, TAIL_SLACK = 10;

        /** One style sheet, rewritten completely at every change of record. If rules were only added,
            there would be three more for each track, and a few hundred by the end of an evening, all
            of them naming lines that no longer exist. */
        let marqueeSheet = null;

        /** The keyframe for one line, or an empty string when the line fits. An animation on a line
            with nowhere to go would move it by zero and cost a frame a second. */
        function walkFor(name, host, span, zoom) {
            span.style.animation = 'none';
            const travel = span.scrollWidth - host.clientWidth + TAIL_SLACK * zoom;

            // The .walks class sets a travelling line to start at the left. Without it the line would
            // stay centred. An inline-block wider than the box it is centred in hangs over BOTH ends,
            // so its first word would be clipped before the walk began, and the walk would take the
            // rest of the text further left. A line that has somewhere to go starts where reading
            // starts.
            host.classList.toggle('walks', travel > 0);
            if (travel <= 0) return '';

            const out = travel / (SCROLL_SPEED * zoom);
            const back = travel / (RETURN_SPEED * zoom);
            const total = SCROLL_START_PAUSE + out + SCROLL_END_PAUSE + back;
            const at = s => (s / total * 100).toFixed(3) + '%';

            span.style.animation = `${name} ${total.toFixed(2)}s linear infinite`;
            return `@keyframes ${name} {
                0%, ${at(SCROLL_START_PAUSE)} { transform: translateX(0); }
                ${at(SCROLL_START_PAUSE + out)},
                ${at(SCROLL_START_PAUSE + out + SCROLL_END_PAUSE)} { transform: translateX(${-travel}px); }
                100% { transform: translateX(0); }
            }`;
        }

        /**
         * Puts the cover on the middle line of the screen.
         *
         * The stack under the cover (the gap, the three lines, the bar and the transport) is
         * measured and not calculated. Two of its parts are type, and the height of type must be
         * measured. A flex box that centres a column that is `words` taller than it really is puts
         * the cover exactly in the middle. The lift is that height.
         *
         * The lift is zero when the stack does not fit. This is why the method is safe: the group
         * then centres on its own height and the transport stays on the screen. A television is not
         * a monitor, and there is no scrollbar to catch what goes off the screen.
         */
        function liftTheCover() {
            const stage = document.getElementById('stage');
            const cover = document.getElementById('centre');
            if (!stage || !cover) return;

            el.root.style.setProperty('--lift', '0px');

            const room = stage.clientHeight;
            const side = cover.offsetHeight;

            // Everything under the cover, INCLUDING the gap above the words. The gap is part of what
            // must be balanced, and a lift that left it out would put the cover one gap too high.
            const gap = parseFloat(getComputedStyle(el.words).marginTop) || 0;
            const below = el.words.offsetHeight + gap;

            // side + below is the composition. The lift adds `below` again, and all of it must fit
            // inside the safe area, or there is no room to move it.
            el.root.style.setProperty('--lift', side + below * 2 <= room ? `${below}px` : '0px');
        }

        function fitLines() {
            if (!marqueeSheet) {
                marqueeSheet = document.createElement('style');
                document.head.appendChild(marqueeSheet);
            }

            const zoom = parseFloat(getComputedStyle(el.root).getPropertyValue('--zoom')) || 1;

            // The names belong to the LINE and not to the walk. A title that still overflows then
            // keeps walking, and does not start its ten seconds again whenever a neighbour is measured.
            marqueeSheet.textContent = [
                walkFor('walk-title', el.lines[0], el.title, zoom),
                walkFor('walk-artist', el.lines[1], el.artist, zoom),
                walkFor('walk-album', el.lines[2], el.album, zoom),
            ].join('\n');

            // The lines make up the height of the stack, so this follows them and does not run on a
            // separate clock.
            liftTheCover();
        }

        window.addEventListener('resize', () => window.setTimeout(fitLines, 60));

        // ── the clock ──────────────────────────────────────────────────────────────────────────

        /** mm:ss, and h:mm:ss for the rare record that needs it. */
        function clock(seconds) {
            if (!isFinite(seconds) || seconds < 0) seconds = 0;
            const s = Math.floor(seconds % 60);
            const m = Math.floor(seconds / 60) % 60;
            const h = Math.floor(seconds / 3600);
            const mm = h > 0 && m < 10 ? `0${m}` : `${m}`;
            return `${h > 0 ? h + ':' : ''}${mm}:${s < 10 ? '0' : ''}${s}`;
        }

        /**
         * The position of the track that is playing.
         *
         * The receiver's own clock counts the STREAM, which runs without a break across every track
         * in it. On its own it would go past the end of each song and never go back. The app sends
         * an anchor with each track: where the track starts in the stream, and which position in the
         * track that is. With the anchor, the position is: track position = anchor + the time that
         * the stream has run since the anchor.
         */
        function streamTime() {
            try {
                const at = playerManager.getCurrentTimeSec();
                return typeof at === 'number' && isFinite(at) ? at : 0;
            } catch (e) {
                return 0;
            }
        }

        function tick() {
            if (!showing) return;

            const streamNow = streamTime();

            // The track that is waiting: the speaker has now reached the changeover it belongs to.
            if (pending && streamNow >= pending.streamAt) {
                const next = pending;
                pending = null;
                paint(next);
                return;
            }

            const elapsed = showing.trackAt + Math.max(0, streamNow - showing.streamAt);
            const duration = showing.duration;
            el.body.classList.toggle('live', !(duration > 0));

            if (duration > 0) {
                // The app's seek bar counts DOWN at its right end. It shows what is left of the record,
                // which is what a person looking up wants to know. SeekBar.RemainText.
                el.remain.textContent = '-' + clock(Math.max(0, duration - elapsed));
                const through = Math.min(100, (elapsed / duration) * 100);
                el.elapsed.style.width = `${through}%`;
                el.knob.style.left = `${through}%`;
            }
        }

        // ── what is playing ────────────────────────────────────────────────────────────────────

        function paint(meta) {
            showing = meta;
            musicIsComing();
            el.body.classList.remove('idle');
            el.seek.classList.add('on');
            el.transport.classList.add('on');
            trouble('');

            // Out, change, back in: one movement, so that the eye can follow it.
            el.words.classList.add('changing');
            window.setTimeout(() => {
                el.title.textContent = meta.title || 'RPM';
                el.artist.textContent = meta.artist || '';
                el.album.textContent = meta.album || '';
                el.words.classList.remove('changing');
                fitLines();
            }, 400);

            if (meta.artData) showArt(meta.artData);
            else showArt(meta.art, () => tell({ type: 'artfail' }));

            tick();
        }

        /**
         * A track that the app says is playing, or is about to play.
         *
         * A track anchored ahead of the stream position is an early announcement of the gapless
         * changeover, and it waits. Any other track is shown now.
         */
        function show(meta) {
            if (!meta) return;

            const next = {
                title: meta.title,
                artist: meta.artist,
                album: meta.album,
                art: meta.art,
                artData: meta.artData,
                duration: meta.duration || 0,
                trackAt: meta.trackAt || 0,
                streamAt: meta.streamAt || 0,
            };

            const streamNow = streamTime();
            if (showing && next.streamAt > streamNow + 0.5) pending = next;
            else paint(next);
        }

        // ── what the room asks for ──────────────────────────────────────────────────────────────

        // Next and previous do NOT arrive as QUEUE_NEXT and QUEUE_PREV. The receiver maps them to a
        // QUEUE_UPDATE with a jump of +1 or -1, so this interceptor is the one that sees them.
        // A listener on QUEUE_NEXT would compile and run, but it would never fire.
        //
        // Returning null declines the request. This is what we want: the app does the skipping, on
        // its side, into the same stream. Handling it here would mean changing the media, and
        // changing the media causes the gap in the music that this receiver exists to avoid.
        safely('queue-interceptor', () => playerManager.setMessageInterceptor(
            cast.framework.messages.MessageType.QUEUE_UPDATE,
            request => {
                if (request && request.jump > 0) tell({ type: 'next' });
                else if (request && request.jump < 0) tell({ type: 'prev' });
                return null;
            }));

        // The buttons that the Home app offers, and the commands that the Assistant accepts for us.
        // There is no SEEK: the stream is live and there is nothing behind the playhead to seek
        // into. RPM seeks by restarting the stream at the new offset, which does not involve the
        // receiver.
        safely('supported-commands', () => {
            const commands = cast.framework.messages.Command;
            playerManager.setSupportedMediaCommands(
                commands.PAUSE |
                commands.STREAM_VOLUME |
                commands.STREAM_MUTE |
                commands.QUEUE_NEXT |
                commands.QUEUE_PREV);
        });

        // The metadata in the LOAD is the metadata of the first track. Every later track arrives on
        // the control channel, because the track changes without the media changing.
        safely('load-interceptor', () => playerManager.setMessageInterceptor(
            cast.framework.messages.MessageType.LOAD,
            request => {
                // This code is wrapped in try/catch on purpose. If an interceptor throws, CAF treats
                // it as a failed load. It answers the sender with LOAD_FAILED and never plays the
                // media. Showing a title is not worth losing the music, so any error in here is
                // reported and not thrown.
                try {
                    const media = request && request.media;
                    const metadata = media && media.metadata;

                    // The stream type arrives already decided, and it is not changed. Surround is
                    // declared LIVE because that is the only way that the device plays AC-3 at all.
                    // Tests on the device itself show that BUFFERED stays in "buffering" for ever,
                    // and LIVE plays and shows Dolby Digital. Changing the type to BUFFERED here
                    // would cause that stall.
                    // A new stream is a new chance to say "it is playing", and a new chance to run out of
                    // data. Neither claim carries over from the stream that it replaces.
                    saidPlaying = false;
                    starving = false;
                    playingSince = 0;
                    loadedAt = Date.now();
                    musicIsComing();
                    shownState = candidateState = null;

                    const stream = media && media.streamType;
                    tell({ type: 'load', contentType: media && media.contentType, streamType: stream });

                    // NOTHING here may fetch media.contentId. It looks like a harmless test of whether
                    // the address can be reached, but it is not. /stream/<id> is a live endpoint that
                    // can be used once. It starts an encoder on the app's side, and the next connection
                    // to it replaces the previous one. A test fetch would therefore use one whole
                    // encode, and the player's own fetch, which is the one that matters, would arrive
                    // second and start the track again.

                    if (metadata) {
                        show({
                            title: metadata.title || metadata.songName,
                            artist: metadata.artist,
                            album: metadata.albumName,
                            art: metadata.images && metadata.images.length ? metadata.images[0].url : null,
                        });
                    }
                } catch (e) {
                    tell({ type: 'error', reason: 'load-interceptor', detail: String((e && e.message) || e) });
                }

                return request;
            }));

        // Report whatever the player refuses, and why. When CAF cannot play a LOAD, it answers with
        // a code and nothing else. The app would see only "would not play the stream", which is the
        // same message for an unplayable codec, a stream that never arrived and a media element
        // that gave up. The code tells these apart, and it costs one message.
        on(cast.framework.events.EventType.ERROR, event => {
            const code = event && event.detailedErrorCode;

            let detail = '';
            try {
                detail = event && event.error
                    ? (event.error.message || JSON.stringify(event.error)).slice(0, 300)
                    : '';
            } catch (e) {
                detail = String((event && event.error) || '');
            }

            tell({ type: 'error', code: code, reason: event && event.reason, detail: detail });

            // 104 means the player refuses the source completely, for example a container it will
            // not accept, whatever the device can decode. It is worth showing on the screen: the app
            // is about to send the same music in another format, and a silent mark would make this
            // look like a fault and not like a fallback.
            trouble(code === 104
                ? 'This speaker will not play that format. Trying another'
                : 'That stream could not be played');
        });

        function trouble(message) {
            el.trouble.textContent = message || '';
            el.trouble.classList.toggle('on', !!message);
        }

        // ── back to the mark ───────────────────────────────────────────────────────────────────
        //
        // The end of a stream does not mean that the music has ended. It also happens when the
        // listener presses next, previous, or stop and then play. RPM answers all three by ending
        // the stream that it is sending and starting another one, and the receiver sees the end of
        // the first stream before it sees the start of the second. If the page acted on the end at
        // once, it would empty the screen and move the mark to the middle, and the next track would
        // move it back a moment later. A skip must not look like the app closing and opening again.
        //
        // So the end of a stream only PROPOSES the mark. Anything that says music is coming (a LOAD
        // arriving, a record being painted) cancels the proposal, and the screen never changed.
        // Only a silence that lasts longer than the wait is a stop.
        const IDLE_AFTER_MS = 4000;
        let idleTimer = 0;

        /** Music is coming: the screen keeps what it is showing. */
        function musicIsComing() {
            if (!idleTimer) return;
            window.clearTimeout(idleTimer);
            idleTimer = 0;
        }

        function goIdle() {
            idleTimer = 0;

            // Ask at the moment that matters, and do not rely on what was true four seconds earlier.
            // The proposal was made because a stream ended. Whether there is music in the room NOW is
            // a different question, and this code answers it. A player that is playing or filling its
            // buffer keeps its screen, whatever ended before this point.
            const now = playerManager.getPlayerState();
            if (now === cast.framework.messages.PlayerState.PLAYING
                || now === cast.framework.messages.PlayerState.BUFFERING) return;

            el.body.classList.add('idle');
            el.seek.classList.remove('on');
            el.transport.classList.remove('on');
            showing = null;
            pending = null;
        }

        on(cast.framework.events.EventType.MEDIA_FINISHED, event => {
            // The reason for the end decides whether it matters. INTERRUPTED and SKIPPED mean that a
            // new LOAD is taking the place of the old media. This is the changeover itself: the music
            // is already playing when these arrive, and the LOAD that caused them has already
            // cancelled every proposal. If the timer started on these, nothing would be left to
            // cancel it, and the mark would move to the middle over a record that is playing.
            const why = event && event.endedReason;
            const EndedReason = cast.framework.messages.EndedReason;
            if (why === EndedReason.INTERRUPTED || why === EndedReason.SKIPPED) return;

            if (idleTimer) return;                 // already proposed, so do not restart the timer
            idleTimer = window.setTimeout(goIdle, IDLE_AFTER_MS);
        });

        // What the speaker is doing, as the speaker reports it. A pause pressed in the room reaches
        // the screen in the same way as it reaches the app, and neither has to guess.
        const PlayerState = cast.framework.messages.PlayerState;

        let saidPlaying = false;
        let starving = false;
        let playingSince = 0;

        /** When the LOAD came in. The wait before the first sound can then be measured and not
            guessed from the sofa. The whole surround start depends on this number. */
        let loadedAt = 0;

        /**
         * How long the speaker must have been playing before a period of buffering counts as a gap.
         *
         * The value is short: it only has to cover the change into playback itself. When the
         * receiver reports a gap in the music, the music really did stop, so a longer window would
         * only hide real gaps. <b>These reports are believed.</b>
         */
        const SETTLE_MS = 500;

        /**
         * How long a transport state must stay the same before the screen shows it.
         *
         * A player under load does not report one state. It changes between them: PLAYING, a short
         * BUFFERING, PLAYING again, and a stumble is often reported as PAUSED on the way. If the
         * screen showed each change, the icon would change several times a second, and this would
         * look like a fault in the app and not like a rough patch in the stream. The delay is long
         * enough to ignore a flicker, and short enough that a pause pressed in the room still
         * looks immediate.
         */
        const STATE_SETTLE_MS = 400;

        let shownState = null;
        let candidateState = null;
        let candidateSince = 0;

        function readState() {
            const state = playerManager.getPlayerState();
            const playing = state === PlayerState.PLAYING;

            // Send this once, when sound really starts. "It loaded" and "it is playing" are different
            // claims, and only the second one shows that a format works.
            if (!saidPlaying && playing) {
                saidPlaying = true;
                tell({ type: 'playing', afterMs: loadedAt ? Date.now() - loadedAt : undefined });
            }

            // The time is measured from the last time that playback started, not the first, so a
            // resume is treated in the same way as a start.
            if (playing && !playingSince) playingSince = Date.now();
            if (!playing && state !== PlayerState.BUFFERING) playingSince = 0;

            // Buffering after steady playback means that this speaker has run out of data. This is a
            // gap in the music, and it is the only reliable measurement of whether the app keeps
            // enough audio ahead of us for this room. It is sent once for each gap and not once a
            // second. Otherwise the app would increase its lead by a minute because of one bad moment.
            const settled = playingSince && Date.now() - playingSince > SETTLE_MS;
            const dry = state === PlayerState.BUFFERING && settled;
            if (dry && !starving) tell({ type: 'starved', afterMs: Date.now() - playingSince });
            starving = dry;

            // The code above reads the raw state, because those are claims about what happened, and
            // a flicker is still something that happened. Only the screen waits until a state is stable.
            if (state !== candidateState) {
                candidateState = state;
                candidateSince = Date.now();
            }

            if (state !== shownState && Date.now() - candidateSince >= STATE_SETTLE_MS) {
                shownState = state;
                el.body.classList.toggle('paused', shownState === PlayerState.PAUSED);
                el.body.classList.toggle('buffering', shownState === PlayerState.BUFFERING);
            }
        }

        // No clock is reported from here, on purpose. The app already asks for a MEDIA_STATUS every
        // second while the music plays, and it runs its own stopwatch between the answers. A second
        // clock on this channel would be one more value written to the same playhead, with
        // nothing to put the two in order.

        [cast.framework.events.EventType.PLAYING,
         cast.framework.events.EventType.PAUSE,
         cast.framework.events.EventType.BUFFERING,
         cast.framework.events.EventType.PLAYER_LOAD_COMPLETE].forEach(
            type => on(type, readState));

        // Once a second is enough for a clock that shows seconds. It is also what decides when the
        // title of a chained track takes over.
        window.setInterval(tick, 1000);

        // The transport state is read more often than that, because the screen waits for it: a state
        // must stay the same for STATE_SETTLE_MS before the screen shows it. If it were checked only
        // once a second, a pause pressed in the room would take up to a second and a half to show.
        window.setInterval(readState, 250);

        // ── the remote ─────────────────────────────────────────────────────────────────────────
        //
        // The D-pad of a television arrives here as arrow keys. Two things would act on them: the
        // page would scroll (prevented by the fixed position above), and the player's own key
        // handling would scrub.
        //
        // <b>Scrubbing is the one gesture that this stream cannot answer.</b> The stream is live and
        // can be used once. There is nothing behind the playhead to seek into, and /stream/<id>
        // starts an encoder for whoever asks and cancels the previous fetch. A seek at the receiver
        // would at best give a playhead that lies, and at worst restart the track. RPM seeks by
        // starting the stream again at the new offset. This is done by the sender and must stay
        // that way. It is also why SEEK is left out of setSupportedMediaCommands.
        //
        // So these keys are swallowed, in the CAPTURE phase, before anything else sees them. Pause,
        // volume and next arrive as media commands and not as keys, so they are not affected.
        //
        // Mapping left and right to previous and next would work: tell({type:'prev'}) is one line,
        // and the app already acts on it from the Home app. It is not done here on purpose,
        // because arrows that skip a track would be a decision about the room and not a fix.
        const SWALLOW = new Set([
            'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown',
            'PageUp', 'PageDown', 'Home', 'End', ' ', 'Spacebar',
        ]);

        /**
         * The D-pad works the transport keys.
         *
         * The transport shows state, because nothing on a television can be pressed, but a row of
         * keys that cannot be used would be misleading. So the D-pad works them: left and right move
         * a ring along the keys in the middle, and OK presses the key that the ring is on. This is
         * the gesture that the remote of the device is made for, and the arrows have no other use
         * here.
         *
         * <b>Every press uses a path that already exists.</b> Next and previous send the same
         * message as the Assistant's "next", so the app skips inside the stream it is already
         * sending and the music does not stop. Play and pause make the receiver pause its OWN media
         * element. CAF reports that as a pause at the speaker, and the app already handles a pause
         * at the speaker (CastSink.RemotePaused). Nothing here is a new way to control the player.
         * It is the remote using the existing ways.
         *
         * The way out and the heart are not in the ring. The first belongs to the app and means
         * nothing in a room. The second would need the app to say whether this record is loved, and
         * to be told back, which needs a message that does not exist.
         */
        /**
         * The keys that the remote can move through, in the order in which they are drawn.
         *
         * The heart is in the list only while the app has said whether this record is loved. A key
         * that cannot be pressed must not be a place where the ring stops, or left and right would
         * move into a gap. The list is read on every move and is not fixed at the start, because
         * the answer arrives with the record, and a record changes under this screen without any
         * other event.
         */
        const RING_ALL = ['favorite', 'prev', 'play-pause', 'next'];
        const RING = () => RING_ALL.filter(id =>
            id !== 'favorite' || el.body.classList.contains('knows-favorite'));
        let ringOn = 'play-pause';     // play and pause is the most likely key
        let ringSeen = 0;             // when the last press was, so the ring can be hidden

        /** How long the ring stays visible after the last press. It is long enough to press twice
            without looking for it again, and short enough that the record is alone on the screen
            the rest of the time. The app's own transport hides after five seconds, for the same reason. */
        const RING_IDLE_MS = 6000;

        function paintRing(up) {
            el.body.classList.toggle('remote', up);
            // This uses the WHOLE row and not only the keys the ring can reach. A heart that has just
            // been hidden must also lose its mark.
            RING_ALL.forEach(id =>
                document.getElementById(id).classList.toggle('on', up && id === ringOn));
        }

        function wake() {
            ringSeen = Date.now();
            paintRing(true);
        }

        window.setInterval(() => {
            if (ringSeen && Date.now() - ringSeen > RING_IDLE_MS) {
                ringSeen = 0;
                paintRing(false);
            }
        }, 500);

        /** Moves the ring one key in the given direction, over the keys that exist now. */
        function walkRing(step) {
            const ring = RING();
            const at = Math.max(0, ring.indexOf(ringOn));
            ringOn = ring[(at + step + ring.length) % ring.length];
        }

        /** Presses the key that the ring is on.

            The name is not `press` because the vinyl code above already has a function `press()`.
            A second function declaration with the same name in the same scope silently REPLACES the
            first. A function called `press` here would stop every cover change from tinting the
            record, and would tell the app to skip the track instead. */
        function pressRingKey() {
            const key = ringOn;

            if (key === 'next') { tell({ type: 'next' }); return; }
            if (key === 'prev') { tell({ type: 'prev' }); return; }

            // The heart is a REQUEST and not a claim. The app owns the value, writes it, and says what
            // it wrote. If the mark were filled in here, it would be wrong whenever the write fails.
            // A record played from outside the collection has no row to hold a mark, and only the
            // app knows this.
            if (key === 'favorite') { tell({ type: 'favorite' }); return; }

            // Play and pause, at the speaker. The app hears this in the same way as a touch on the
            // speaker's own surface. This is why it is not a message of ours.
            try {
                if (playerManager.getPlayerState() === PlayerState.PAUSED) playerManager.play();
                else playerManager.pause();
            } catch (e) {
                tell({ type: 'error', reason: 'remote-play-pause', detail: String((e && e.message) || e) });
            }
        }

        window.addEventListener('keydown', event => {
            const key = event.key;

            // OK, and the other names that a television uses for it. The code checks keyCode as well
            // as key, because a remote is not a keyboard and older devices send only one of them.
            const ok = key === 'Enter' || key === 'Select' || key === 'Accept'
                    || event.keyCode === 13 || event.keyCode === 23;

            if (ok) {
                event.preventDefault();
                event.stopPropagation();
                // The FIRST press only shows the ring. Pressing OK on a screen with no ring is a press
                // on nothing in particular, and skipping a track because of it would surprise people
                // and make them stop using the remote.
                if (ringSeen) pressRingKey();
                wake();
                return;
            }

            if (!SWALLOW.has(key)) return;
            event.preventDefault();
            event.stopPropagation();

            // The ring is only used while something is playing. A ring on the mark alone has nothing
            // to press.
            if (!showing) return;

            if (key === 'ArrowLeft' || key === 'ArrowRight') {
                if (ringSeen) walkRing(key === 'ArrowRight' ? 1 : -1);
                wake();
            } else if (key === 'ArrowUp' || key === 'ArrowDown') {
                // Up and down are the volume on every television, and the volume keys of the platform
                // already do this. So here they only show the ring, and are not a second, weaker way
                // to change the volume of the room.
                wake();
            }
        }, true);

        // ── how loud the room is ───────────────────────────────────────────────────────────────
        //
        // This is the SPEAKER's own volume, and not a number that the app keeps. It can be changed
        // in the Home app, on a remote, or by voice, and the knob on this screen must show the
        // level that really changes. The platform reports the volume, and reports when it changes.

        /**
         * <b>There is no getter.</b> CastReceiverContext has no getSystemVolume. The volume arrives
         * as an event and only as an event (cast.framework.system.SYSTEM_VOLUME_CHANGED, with a
         * SystemVolumeData that holds a level from 0 to 1 and a muted flag). Code that calls a
         * method that does not exist fails silently inside a try, and the line would stay at zero
         * on a speaker that is turned up to half.
         *
         * So the knob is hidden until the device has really reported a level, and is not drawn at a
         * number that nobody gave us. The device reports as soon as anything changes the volume,
         * including the app, because the slider in the app drives the speaker's own volume and so
         * produces this event.
         */
        function showVolume(volume) {
            if (!volume || typeof volume.level !== 'number') return;

            const level = Math.max(0, Math.min(1, volume.level)) * 100;
            el.volumeFill.style.width = `${level}%`;
            el.volumeKnob.style.left = `${level}%`;
            el.body.classList.add('knows-volume');
            el.body.classList.toggle('muted', volume.muted === true);
        }

        safely('volume', () => context.addEventListener(
            cast.framework.system.EventType.SYSTEM_VOLUME_CHANGED,
            event => showVolume(event && event.data)));

        // ── what the app asks for ───────────────────────────────────────────────────────────────

        safely('control-channel', () => context.addCustomMessageListener(NAMESPACE, event => {
            const message = event.data;
            if (!message) return;

            if (message.type === 'playing') {
                return;   // our own message, sent back by the broadcast; nothing to do
            }

            if (message.type === 'meta') {
                // The track changed inside a stream that did not stop. Only the screen changes. Touching
                // the media here is what this receiver must avoid.
                show(message);
            } else if (message.type === 'art') {
                // The app's answer about a cover that we could not fetch: the picture itself, or
                // nothing, which means that this track has no cover. Both are answers and both are
                // used. If the empty answer were ignored, the sleeve of the last record would stay
                // visible over a song that has no cover of its own. See showArt.
                showArt(message.data || null);
            } else if (message.type === 'favorite') {
                // What the app wrote, or that there is nothing to write. If `on` is absent, this record
                // is not one that the collection holds, and the heart is hidden. It does not stay
                // hollow over a song that it could not be pressed for.
                const known = typeof message.on === 'boolean';
                el.body.classList.toggle('knows-favorite', known);
                el.body.classList.toggle('favorite', known && message.on);
                // The ring must not stay on a key that has just been hidden.
                if (!known && ringOn === 'favorite') ringOn = 'play-pause';
                paintRing(!!ringSeen);
            } else if (message.type === 'screen') {
                // The picture, off or on. The music is not touched. This is for a television that
                // nobody is watching, and it is not a pause.
                el.body.classList.toggle('blackout', message.on === false);
            }
        }));

        // ── staying awake ───────────────────────────────────────────────────────────────────────
        //
        // For the device, a television that plays audio and shows a still picture looks like a page
        // that nobody has touched for ten minutes. The Shield then dims and sleeps, and the room
        // goes dark with it. `disableIdleTimeout` does not help: it is the session timeout of CAF
        // and has no effect on the panel.
        //
        // The screen wake lock is the documented way to say "something is happening here". It is
        // held only while there is a picture worth keeping lit. When the screen is deliberately off
        // (see the `screen` message), the lock is released, and the device may sleep. That is the
        // purpose of turning the screen off.
        //
        // <b>A lock does not survive the page going away and coming back.</b> The platform releases
        // it on its own, and the specification says so. This is why the lock is requested again on
        // visibilitychange and is not taken once and trusted.
        let wakeLock = null;

        async function holdTheScreen(want) {
            try {
                if (!want) {
                    if (wakeLock) { const held = wakeLock; wakeLock = null; await held.release(); }
                    return;
                }

                if (wakeLock || document.visibilityState !== 'visible') return;
                if (!navigator.wakeLock) return;

                wakeLock = await navigator.wakeLock.request('screen');
                // The platform can release the lock as well as us. A lock that has gone must not be
                // remembered as held, or it is never requested again.
                wakeLock.addEventListener('release', () => { wakeLock = null; });
            } catch (e) {
                // The request was refused, or the device does not implement it. This is reported once
                // and is not a reason to stop: a screen that sleeps is a nuisance, and the music is the job.
                wakeLock = null;
                tell({ type: 'error', reason: 'wake-lock', detail: String((e && e.message) || e) });
            }
        }

        /** Whether there is anything on the screen that is worth keeping lit. */
        function wantTheScreen() {
            return !el.body.classList.contains('blackout') && !el.body.classList.contains('idle');
        }

        document.addEventListener('visibilitychange', () => holdTheScreen(wantTheScreen()));
        window.setInterval(() => holdTheScreen(wantTheScreen()), 5000);
        holdTheScreen(true);

        // Also report what the device says it is doing with the panel. This is the only way to tell
        // a television that has gone to sleep from one that is showing something else. The state is
        // reported and not acted on, because an audio receiver does NOT stop when its picture goes away.
        [['standby', () => context.getStandbyState()],
         ['visibility', () => context.getVisibilityState()]].forEach(([what, read]) => {
            const type = what === 'standby'
                ? cast.framework.system.EventType.STANDBY_CHANGED
                : cast.framework.system.EventType.VISIBILITY_CHANGED;
            safely(what, () => context.addEventListener(type, () => {
                let state = 'unknown';
                try { state = String(read()); } catch (e) { }
                tell({ type: 'screenstate', what: what, state: state });
                // Coming back from standby is a new page for the purpose of the lock.
                holdTheScreen(wantTheScreen());
            }));
        });

        // ── what this device can do ─────────────────────────────────────────────────────────────

        // Sent once, on connect, so that the app can choose a format from what the hardware can
        // decode and not from a setting that the listener has to guess. A speaker that cannot pass
        // Dolby through should be sent stereo, and must be able to say so.
        /**
         * What the media pipeline will accept, as opposed to what the device can decode.
         *
         * These are two different questions, and the difference is where 5.1 goes wrong.
         * canDisplayType asks the Cast platform, which knows that the device can pass Dolby through
         * to an amplifier. The player that must hold the stream is a browser media element, and it
         * answers separately. A device can answer yes to the first and no to the second. The result
         * is a LOAD that fails for a codec that the hardware supports.
         */
        function playable() {
            const probe = document.createElement('audio');
            const types = {
                'mp4-ac3': 'audio/mp4; codecs="ac-3"',
                'mp4-eac3': 'audio/mp4; codecs="ec-3"',
                'ts-ac3': 'video/mp2t; codecs="ac-3"',
                'ac3': 'audio/ac3',
                // Both names of the same container, because a device that answers for one of them may
                // say nothing for the other. audio/x-matroska is the correct name for a file with no
                // picture, and video/x-matroska is the name that everybody registers. We send the
                // first. A yes for either means that the demuxer is there.
                'mka-flac': 'audio/x-matroska; codecs="flac"',
                'mkv-flac': 'video/x-matroska; codecs="flac"',
                // Not a container that we send. It is asked so that "decodes FLAC but has no Matroska"
                // can be told apart from "cannot decode FLAC" when a speaker rejects lossless.
                'flac': 'audio/flac',
                'mp3': 'audio/mpeg',
            };

            const answer = {};
            for (const [name, type] of Object.entries(types)) {
                try {
                    const element = probe.canPlayType(type);      // "", "maybe" or "probably"
                    const mse = window.MediaSource && window.MediaSource.isTypeSupported
                        ? window.MediaSource.isTypeSupported(type)
                        : null;
                    answer[name] = `${element || 'no'}${mse === null ? '' : mse ? '+mse' : '-mse'}`;
                } catch (e) {
                    answer[name] = 'threw';
                }
            }
            return answer;
        }

        function greet(senderId) {
            // Nothing in here may stop the greeting from being sent. The app chooses a format from it,
            // and a capability probe that throws would leave the app choosing without information.
            let capabilities = {};
            let plays = {};
            try { capabilities = context.getDeviceCapabilities() || {}; } catch (e) { }
            try { plays = playable(); } catch (e) { plays = { probe: 'threw' }; }

            // Each call has its own try, and not one try for all of them. A platform that does not
            // know one MIME string then still answers for the other four.
            const decodes = (mime, codec) => {
                try { return context.canDisplayType(mime, codec) === true; } catch (e) { return false; }
            };

            context.sendCustomMessage(NAMESPACE, senderId, {
                type: 'hello',
                v: PROTOCOL,
                caps: {
                    ac3: decodes('audio/mp4', 'ac-3'),
                    eac3: decodes('audio/mp4', 'ec-3'),
                    flac: decodes('audio/x-matroska', 'flac') || decodes('video/x-matroska', 'flac'),
                    hiResAudio: capabilities.hi_res_audio_supported === true,

                    // Left out when the device did not say, and not sent as false. The app reads a
                    // missing answer as "it might have a screen" and keeps the blackout switch
                    // available. False means a speaker, and turns the switch off.
                    display: typeof capabilities.display_supported === 'boolean'
                        ? capabilities.display_supported
                        : undefined,
                },
                plays: plays,
                setupFailures: setupFailures.length ? setupFailures : undefined,
            });
        }

        context.addEventListener(
            cast.framework.system.EventType.SENDER_CONNECTED,
            event => greet(event.senderId));

        // The room before there is a record in it: the app's blue on its near-black. It is painted
        // now and not left to the first track, so that the mark stands in a room and not on a flat
        // black rectangle.
        paintRoom(ROOM_FALLBACK);

        // The SDK gives up on an idle session by default. A speaker has no screen to time out and
        // the stream is live, so this session is never idle in the sense that the SDK means.
        // The receiver is started last, and it starts even if an earlier step failed. A receiver
        // that does not start is a television that shows a logo for ever, which is worse than a
        // receiver without a title card.
        const options = new cast.framework.CastReceiverOptions();
        safely('options', () => {
            options.customNamespaces = { [NAMESPACE]: cast.framework.system.MessageType.JSON };
            options.disableIdleTimeout = true;
        });

        context.start(options);
    </script>
</body>
</html>
